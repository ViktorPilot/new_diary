{% extends "note/base.html" %}
{% block title %}Удаление записи{% endblock %}
{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h1 class="h4 mb-3">
                        Удалить запись?
                    </h1>
                    <p class="text-secondary mb-3">
                        Вы действительно хотите удалить эту запись?
                    </p>
                    <div class="border rounded p-3 mb-4">
                        <div class="text-secondary small mb-1">
                            {{ object.date|date:"d.m.Y" }}
                        </div>
                        <h2 class="h5 mb-2">
                            {{ object.title }}
                        </h2>
                        <p class="mb-0">
                            {{ object.text|truncatewords:20 }}
                        </p>
                    </div>
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex gap-2">
                            <button type="submit"
                                    class="btn btn-danger">
                                Удалить
                            </button>
                            <a href="{% url 'note:note_detail' object.pk %}"
                               class="btn btn-outline-secondary">
                                Отмена
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
