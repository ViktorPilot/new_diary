{% extends 'note/base.html' %}
{% block title %}note_detail{% endblock %}
{% block content %}

<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">New_diary</h1>
    <p class="lead">New_diary - это отличный вариант для ведения личного дневника</p>
</div>
<div class="row">
    <div class="col-3 "></div>
    <div class="col-6 ">
        <div class="card border-secondary text-bg-light mb-3 px-3">
            <div class="pricing-header px-3 py-3 pt-md-2 pb-md-2 mx-auto text-center">
                <h5 class="display-6">Вход в аккаунт</h5>
            </div>
            <div class="card-body text-secondary">
                <form class="row g-3" method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary">Войти</button>
                        <a href="{% url 'users:register' %}"
                           class="btn btn-outline-secondary"
                           style="font-size: 1.00rem; padding: 0.4rem 0.5rem;">
                            Зарегистрироваться
                        </a>
                    </div>

                </form>
            </div>
        </div>
    </div>
    <div class="col-3 "></div>
</div>
{% endblock %}
